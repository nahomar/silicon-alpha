name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Python tests (Phase 0 + quantiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          # scikit-learn / vaderSentiment are imported lazily inside nlpalpha
          # functions, so a missing one breaks only at call time -- i.e. in a
          # test, not at collection. Installed here so CI exercises those paths.
          pip install numpy scipy pandas pytest scikit-learn vaderSentiment
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        # Whole tree rather than a hand-maintained file list: the list was
        # conflicting on every branch that added a test, and silently omitting
        # a new suite is the failure it invites. test_heston_cpp is excluded
        # because it needs the C++ binary, which the cpp-heston job builds.
        run: PYTHONPATH=. pytest tests/ --ignore=tests/odte/test_heston_cpp.py -q

  cpp-heston:
    name: C++ Heston engine (build + self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C cpp CXX=g++
      - name: Self-test (BS-limit correctness + antithetic VR)
        run: ./cpp/heston_mc --selftest
